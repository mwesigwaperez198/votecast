<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DA_VELA Fashions | Live Scoreboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600;700;800;900&family=Cormorant:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/scoreboard/style.css?v=2">
</head>
<body>
    <div class="noise"></div>
    <div class="vignette"></div>

    <div class="sb">
        <header class="sb-head">
            <div class="sb-brand">
                <span class="sb-mark">DV</span>
                <div class="sb-brand-text">
                    <span class="sb-name">DA_VELA</span>
                    <span class="sb-sub">FASHIONS</span>
                </div>
            </div>
            <div class="sb-live">
                <span class="sb-pulse"></span>
                <span>LIVE SCOREBOARD</span>
            </div>
            <div class="sb-state" id="sb-state">AWAITING</div>
        </header>

        <main class="sb-main">
            <div id="cd" class="cd">
                <div class="cd-ring"></div>
                <div class="cd-num" id="cd-num">10</div>
                <div class="cd-lab" id="cd-lab">GET READY</div>
            </div>

            <div id="win" class="win">
                <div class="win-bg"></div>
                <div class="win-inner">
                    <div class="win-kicker">WINNER</div>
                    <img id="win-photo" class="win-photo" src="" alt="" style="cursor:pointer">
                    <h2 class="win-name" id="win-name"></h2>
                    <div class="win-stage" id="win-stage"></div>
                    <div class="win-grid">
                        <div class="win-card">
                            <span class="win-val" id="win-pts">0</span>
                            <span class="win-lab">POINTS</span>
                        </div>
                        <div class="win-card">
                            <span class="win-val" id="win-voters">0</span>
                            <span class="win-lab">TOTAL VOTERS</span>
                        </div>
                        <div class="win-card">
                            <span class="win-val" id="win-pct">0%</span>
                            <span class="win-lab">ANALYSIS</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="board" id="board"></div>
        </main>

        <footer class="sb-foot">
            <span>POWERED BY NOVARA TECHNOLOGIES LIMITED</span>
        </footer>
    </div>

    <style>
        .lb-photo { cursor:pointer; }
        @keyframes cdPulse { 0% { transform: scale(1); } 50% { transform: scale(1.08); } 100% { transform: scale(1); } }
    </style>
    <script src="/scoreboard/app.js?v=4"></script>
</body>
</html>
